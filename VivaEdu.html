<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VivaEdu | Login</title>

    <link rel="stylesheet" href="VivaEdu.css">
</head>

<body class="pagina-login">

    <main class="login-container">

        <section class="login-apresentacao">

            <div class="logo-login">
                <div class="logo-simbolo">V</div>

                <div>
                    <strong>VivaEdu</strong>
                    <span>SISTEMA ESCOLAR</span>
                </div>
            </div>

            <div class="texto-apresentacao">
                <span>PORTAL EDUCACIONAL</span>

                <h1>
                    Tudo da sua escola
                    em um só lugar.
                </h1>

                <p>
                    Acompanhe atividades e notas
                    de forma simples e organizada.
                </p>
            </div>

            <div class="ilustracao">
                <div class="livro livro-1"></div>
                <div class="livro livro-2"></div>
                <div class="planta"></div>
            </div>

        </section>


        <section class="login-area">

            <div class="login-card">

                <span class="tag">
                    ACESSO AO SISTEMA
                </span>

                <h2>Bem-vindo!</h2>

                <p class="descricao-login">
                    Entre com seu e-mail e senha para continuar.
                </p>

                <form id="formLogin">

                    <div class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="seunome@escola.pr.gov.br"
                            autocomplete="off"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="senha">
                            Senha
                        </label>

                        <div class="senha-container">

                            <input
                                type="password"
                                id="senha"
                                placeholder="Digite 6 números"
                                maxlength="6"
                                minlength="6"
                                inputmode="numeric"
                                pattern="[0-9]{6}"
                                required
                            >

                            <button
                                type="button"
                                id="mostrarSenha"
                            >
                                ◉
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="botao-principal"
                    >
                        Entrar
                    </button>


                    <div
                        id="mensagemLogin"
                        class="mensagem-login"
                    ></div>

                </form>


                <p class="cadastro-link">
                    Ainda não possui uma conta?

                    <a href="Vcadastro.html">
                        Criar conta
                    </a>
                </p>

            </div>

        </section>

    </main>

    <script src="VivaEdu.js"></script>

</body>

</html>
